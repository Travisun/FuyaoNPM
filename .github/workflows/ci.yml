name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (mock-based, no API key required)
        run: npm test

      - name: Build (ESM + CJS + DTS)
        run: npm run build

      - name: Smoke-test built artifacts (CJS/ESM importable)
        run: |
          node -e "const { FuyaoClient } = require('./dist/index.cjs'); if (typeof new FuyaoClient({ apiKey: 'x' }).meta.search !== 'function') process.exit(1);"
          node --input-type=module -e "import('./dist/index.js').then(m => { if (typeof new m.FuyaoClient({ apiKey: 'x' }).funds.news.articleList !== 'function') process.exit(1); })"
